<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
    <h1>Calculator</h1>
    </div>
    <div class="calculator">
        <input type="text" id="display" height="50px" width="100px" >
    </div>

<div class="buttons">

<button onclick="clear()" id="clear">AC</button>
<button onclick="del()" id="delete">DEL</button>
<button onclick="percent()" id="percent">%</button>
<button onclick="divide()" id="divide">/</button>

<button onclick="display('7')" id="7">7</button>
<button onclick="display('8')" id="8">8</button>
<button onclick="display('9')" id="9">9</button>
<button onclick="multiply()" id="multiply">*</button>


<button onclick="display('4')" id="4">4</button>
<button onclick="display('5')" id="5">5</button>
<button onclick="display('6')" id="6">6</button>
<button onclick="minus('-')" id="-">-</button>

<button onclick="display('1')" id="1">1</button>
<button onclick="display('2')" id="2">2</button>
<button onclick="display('3')" id="3">3</button>
<button onclick="plus('+')" id="+">+</button>


<button onclick="display('0')"id="0">0</button>
<button onclick="display('.')" id=".">.</button>
<button onclick="calculate()" id="equal">=</button>


</div>
